name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy
      - run: python examples/six_strategies.py
      - run: python benchmarks/run.py --repeat 3 --output benchmark-results.json
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/verify_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-and-benchmark
          path: |
            dist/
            benchmark-results.json

  installed-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        extras: [core, providers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - name: Install actual wheel
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          for wheel in dist/*.whl; do
            if [ "$EXTRAS" = providers ]; then
              python -m pip install "${wheel}[providers]"
            else
              python -m pip install --no-deps "$wheel"
            fi
          done
      - run: python -m pytest -q -m 'not integration'
      - run: python -I scripts/smoke_install.py
